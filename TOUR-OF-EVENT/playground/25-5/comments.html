<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>25-5 Create a comment box and display comment</title>
</head>
<style>
button {
    border: none;
    background-color: #845EC2;
    color: #fff;
    padding: 10px;
    width: 34.2%;
    cursor: pointer;
}

</style>

<body>

    <h2>Comments</h2>

    <textarea class="comment-input" name="comments" placeholder="Your comments goes here" cols="60"
        rows="10"></textarea>
         <br>

    <button class="comment-btn">Post</button>
    <div class="comments"></div>

    <script src="comments.js"></script>
</body>

</html>
